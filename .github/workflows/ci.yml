name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kappacut
          POSTGRES_PASSWORD: kappacut
          POSTGRES_DB: kappacut
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kappacut" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://kappacut:kappacut@localhost:5432/kappacut
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci
      VERIFICATION_TOKEN_SECRET: ci2
      RESET_PASSWORD_TOKEN_SECRET: ci3
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: ci
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      S3_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic revision --autogenerate -m ci-drift && ls alembic/versions/*ci_drift* && test -z "$(grep -E 'op\.(create|drop|add|alter)' alembic/versions/*ci_drift*)"
        # autogenerate against the freshly-migrated DB must be empty (schema == models).
        # The file is named <rev>_ci_drift.py: a `*ci-drift*` glob matched nothing, grep
        # printed nothing, and this step passed whatever the models said. `ls` fails the
        # step if the file ever goes missing again.
      - run: python -c "import app.main, app.worker, app.cli, kappacut, pipeline"
      # Key building, guards and presigning are pure-local — no bucket or network needed.
      # Runs under plain python today; `pytest tests/` collects the same file unchanged.
      - run: python tests/test_storage_keys.py
      # Clip-picking logic, face camera path, render helpers. No network: the model reply is
      # scripted. ffmpeg makes the moving-crop test real; without it that one test skips.
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python tests/test_clip_brain.py
      - run: python tests/test_evaluate.py
      - run: python tests/test_train_weights.py
      - run: python tests/test_training.py
      - run: python tests/test_request_checks.py
      - run: python tests/test_launch.py
      - run: python tests/test_admin.py
      - run: python tests/test_agent.py
      - run: python tests/test_languages.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

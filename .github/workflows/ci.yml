name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clipfinder
          POSTGRES_PASSWORD: clipfinder
          POSTGRES_DB: clipfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipfinder" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://clipfinder:clipfinder@localhost:5432/clipfinder
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci
      VERIFICATION_TOKEN_SECRET: ci2
      RESET_PASSWORD_TOKEN_SECRET: ci3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt ruff
      - run: ruff check app clipfinder.py pipeline.py
      - run: alembic upgrade head
      - run: alembic revision --autogenerate -m ci-drift && test -z "$(grep -E 'op\.(create|drop|add|alter)' alembic/versions/*ci-drift*)"
        # autogenerate against the freshly-migrated DB must be empty (schema == models)
      - run: python -c "import app.main, app.worker, app.cli, clipfinder, pipeline"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

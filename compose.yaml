name: kappacut

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kappacut}:${POSTGRES_PASSWORD:-kappacut}@postgres:5432/${POSTGRES_DB:-kappacut}
  REDIS_URL: redis://redis:6379/0
  WEB_DIR: /srv/web
  # All media lives in the bucket (PLAN-v2.md Phase A). MEDIA_ROOT survives only for the
  # one-shot `migrate-media` command and can go once that has run and been verified.
  MEDIA_ROOT: /media
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set S3_ENDPOINT_URL in .env — see .env.example}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
  S3_REGION: ${S3_REGION:-auto}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # These fallbacks are DEV-ONLY and published in this repo — anyone who knows them can
  # forge a session for any account. `:-` also substitutes on an EMPTY value, so a .env
  # copied from .env.example and left unfilled lands here silently; app/config.py's
  # check_production_ready() refuses to boot with them once the deploy looks public.
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
  VERIFICATION_TOKEN_SECRET: ${VERIFICATION_TOKEN_SECRET:-dev-insecure-change-me-2}
  RESET_PASSWORD_TOKEN_SECRET: ${RESET_PASSWORD_TOKEN_SECRET:-dev-insecure-change-me-3}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}   # must be true in prod (HTTPS-only session cookie)
  ENVIRONMENT: ${ENVIRONMENT:-dev}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kappacut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kappacut}
      POSTGRES_DB: ${POSTGRES_DB:-kappacut}
    volumes:
      # Postgres 18+ images want the mount one level up (data goes in a version subdir).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kappacut} -d ${POSTGRES_DB:-kappacut}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      # Only `app.cli migrate-media` reads this. Drop the mount and the `media` volume
      # once the migration has run and been verified.
      - media:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  worker:
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    # No media mount: the worker pulls each source into a temp dir it owns and uploads the
    # clips back. Its scratch space is the container filesystem — see quota.assert_disk_ok.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Fails once the worker loop stops refreshing its heartbeat (health_check_interval in
    # app/worker.py). Plain Docker won't restart an unhealthy container, but it makes a
    # wedged worker visible in `docker ps` instead of reading as plain "Up".
    # start_period covers sfx synthesis and waiting for `alembic upgrade head`.
    healthcheck:
      test: ["CMD", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    # docker stop sends SIGTERM, then SIGKILL after this; the worker uses it to finish its
    # running job (WorkerSettings.job_completion_wait) instead of losing it on every deploy
    stop_grace_period: 10m
    logging: *logging
    # Hard guardrail so a misbehaving/oversubscribed ffmpeg run can never starve web/postgres/
    # redis on the same box, on top of FFMPEG_THREADS (which sizes each *job's* share).
    # Uncomment and set to (vCPU count - ~1) for the box; see DEPLOY.md "Capacity notes".
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "3.0"

  # nightly pg_dump | gzip into the `backups` volume, keep the last BACKUP_KEEP.
  # Uses the postgres image so the client version always matches the server.
  # Ship `backups` offsite from the host (restic / rclone) — see DEPLOY.md.
  backup:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-kappacut}
      PGUSER: ${POSTGRES_USER:-kappacut}
      PGDATABASE: ${POSTGRES_DB:-kappacut}
      PGHOST: postgres
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    entrypoint:
      - sh
      - -c
      # pipefail: without it the pipeline's status is gzip's, so a failed pg_dump still left
      # a small valid .gz, never said "dump failed", and the rotation below deleted a good
      # backup for it - a week of failures and none were left. A dump only counts (and only
      # rotates the old ones out) once it has fully succeeded.
      - |
        set -eo pipefail
        while true; do
          f="/backups/kappacut-$$(date -u +%Y%m%d-%H%M%S).sql.gz"
          echo "dumping -> $$f"
          if pg_dump --no-owner --no-privileges | gzip -6 > "$$f.partial"; then
            mv "$$f.partial" "$$f"
            ls -1t /backups/kappacut-*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP+1)) | xargs -r rm -f
          else
            echo "dump failed - keeping the existing backups"
            rm -f "$$f.partial"
          fi
          sleep 86400
        done
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # tusd writes multipart uploads straight into the bucket under `uploads/`; the app's
  # post-finish hook then server-side-copies the finished object to the project's source
  # key. No shared volume, and nothing to sweep — expiry of abandoned partials is a bucket
  # lifecycle rule on that prefix (see DEPLOY.md).
  tusd:
    image: ghcr.io/tus/tusd:v2
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/files/
      - -behind-proxy
      - -s3-bucket=${S3_BUCKET}
      - -s3-endpoint=${S3_ENDPOINT_URL}
      - -s3-object-prefix=uploads/
      - -s3-part-size=52428800
      # the same variable app/config.py's quota_max_upload_bytes reads, so raising the limit
      # in .env raises it here too (Caddyfile's request_body cap is per request, i.e. per
      # 8 MB tus chunk, so it doesn't bound the file)
      - -max-size=${QUOTA_MAX_UPLOAD_BYTES:-2147483648}
      - -hooks-http=http://web:8000/api/upload/hooks
      - -hooks-http-forward-headers=Cookie,Authorization
      - -hooks-enabled-events=pre-create,post-finish,post-terminate
    environment:
      # tusd's s3store reads the standard AWS variables
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_REGION: ${S3_REGION:-auto}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    ports:
      - "${HTTP_PORT:-8000}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redis_data:
  media:
  backups:
  caddy_data:
  caddy_config:
